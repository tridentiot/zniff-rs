[package]
name = "zniff-rs-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
default = ["storage"]
# SQLite-backed frame storage. Not available on wasm32 (bundled SQLite is C).
storage = ["dep:rusqlite"]
# Tests that read a real capture. The traces are not in the repository,
# since a capture carries the home ids, node ids and key exchange of the
# network it was taken from. See crates/core/tests/fixtures/README.md.
fixtures = []

[dependencies]
crc16 = "0.4.0"
hex = "0.4.3"
quick-xml = { version = "0.38.3", features = ["serialize"] }
rusqlite = { version = "0.38.0", features = ["bundled", "rusqlite-macros"], optional = true }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.17"
