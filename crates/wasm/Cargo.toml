[package]
name = "zniff-rs-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
hex = "0.4.3"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
zniff-rs-core = { path = "../core", default-features = false }

[dependencies.web-sys]
version = "0.3"
features = ["Headers", "Request", "RequestInit", "Response", "Window", "WorkerGlobalScope", "Navigator", "Serial", "SerialPort", "SerialOptions", "SerialPortRequestOptions", "SerialPortInfo", "ReadableStream", "WritableStream", "ReadableStreamDefaultReader", "WritableStreamDefaultWriter", "ReadableStreamReadResult"]
